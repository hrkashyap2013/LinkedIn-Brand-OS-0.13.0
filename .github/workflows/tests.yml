name: tests

# Runs the whole test suite on Ubuntu, macOS and Windows. The oldest supported Python (3.8) runs on Ubuntu and Windows;
# macOS runs on the current runner with a current Python (Python 3.8 has no build for the current Apple-silicon runners).
# If GitHub retires a runner image, change the matrix below (the code itself supports Python 3.8 or newer).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-22.04, python: "3.12"}
          - {os: windows-latest, python: "3.8"}
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generated files are up to date
        run: python scripts/build.py --check
      - name: No keys or tokens in the repository
        run: python scripts/check_secrets.py
      - name: Run all tests
        run: python tests/run_all.py
